<!DOCTYPE html>
<html th:replace="~{layout :: layout}" lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Новый приказ об отчислении</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <i class="bi bi-file-text"></i> Создание приказа об отчислении
                </div>
                <div class="card-body">
                    <form th:action="@{/releases/new}" th:object="${releaseDto}" method="post">
                        <h5 class="mb-3">Данные приказа</h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Номер приказа</label>
                                <input type="text" class="form-control" th:field="*{documentNumber}" readonly>
                                <small class="text-muted">Номер генерируется автоматически</small>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Дата приказа *</label>
                                <input type="date" class="form-control" th:field="*{documentDate}" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12 mb-3">
                                <label>Ученик *</label>
                                <select class="form-select" th:field="*{studentId}" required>
                                    <option value="">-- выберите --</option>
                                    <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.fullName} + ' (' + ${s.className} + ')'"></option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12 mb-3">
                                <label>Основание</label>
                                <input type="text" class="form-control" th:field="*{basis}" placeholder="например, на основании заявления родителей">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label>Дата документа-основания</label>
                                <input type="date" class="form-control" th:field="*{basisDocumentDate}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Дата начала действия</label>
                                <input type="date" class="form-control" th:field="*{dateFrom}" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12 mb-3">
                                <label>Дата отчисления *</label>
                                <input type="date" class="form-control" th:field="*{dateOn}" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="/releases" class="btn btn-secondary">Отмена</a>
                            <button type="submit" class="btn btn-success">Создать приказ</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
