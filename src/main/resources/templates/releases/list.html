<!DOCTYPE html>
<html th:replace="~{layout :: layout}" lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Приказы об отчислении</title>
</head>
<body>
<div th:fragment="content">
  <div th:if="${success}" class="alert alert-success">[[${success}]]</div>
  <div th:if="${error}" class="alert alert-danger">[[${error}]]</div>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Приказы об отчислении</h2>
    <a href="/releases/new" class="btn btn-success">+ Новый приказ</a>
  </div>

  <div th:if="${releases.empty}" class="alert alert-info">
    Нет ни одного приказа. <a href="/releases/new">Создать первый</a>
  </div>

  <div class="card shadow" th:unless="${releases.empty}">
    <div class="card-header bg-light">Список приказов</div>
    <div class="card-body">
      <table class="table table-hover">
        <thead>
        <tr>
          <th>ID</th>
          <th>Номер приказа</th>
          <th>Дата приказа</th>
          <th>Ученик</th>
          <th>Дата отчисления</th>
          <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${releases}">
          <td th:text="${r.id}">1</td>
          <td th:text="${r.documentNumber}">Пр-Отч-1-24</td>
          <td th:text="${#temporals.format(r.documentDate, 'dd.MM.yyyy')}">...</td>
          <td th:text="${r.studentFullName}">Иванов Иван</td>
          <td th:text="${#temporals.format(r.dateOn, 'dd.MM.yyyy')}">01.06.2024</td>
          <td>
            <a th:href="@{/releases/{id}(id=${r.id})}" class="btn btn-sm btn-info">Карточка</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
