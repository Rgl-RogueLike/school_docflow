<!DOCTYPE html>
<html th:replace="~{layout :: layout}" lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Приказы о зачислении (несколько учеников)</title>
</head>
<body>
<div th:fragment="content">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Приказы о зачислении (групповые)</h2>
        <a href="/enrollments-more/new" class="btn btn-success">
            <i class="bi bi-plus-lg"></i> Новый приказ
        </a>
    </div>

    <div th:if="${enrollments.empty}" class="alert alert-info">
        <i class="bi bi-info-circle"></i> Нет ни одного приказа.
        <a href="/enrollments-more/new" class="alert-link">Создать первый приказ</a>
    </div>

    <div class="card shadow" th:unless="${enrollments.empty}">
        <div class="card-header bg-light">
            <i class="bi bi-list-check"></i> Список приказов
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Номер приказа</th>
                    <th>Дата приказа</th>
                    <th>Количество учеников</th>
                    <th>Дата зачисления</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${enrollments}">
                    <td th:text="${e.id}">1</td>
                    <td th:text="${e.documentNumber}">Пр-Зач-1-24</td>
                    <td th:text="${#temporals.format(e.documentDate, 'dd.MM.yyyy')}">...</td>
                    <td th:text="${#lists.size(e.items)}">5</td>
                    <td th:text="${#temporals.format(e.dateFrom, 'dd.MM.yyyy')}">01.09.2024</td>
                    <td>
                        <a th:href="@{/enrollments-more/{id}(id=${e.id})}" class="btn btn-sm btn-info">
                            <i class="bi bi-eye"></i> Карточка
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
