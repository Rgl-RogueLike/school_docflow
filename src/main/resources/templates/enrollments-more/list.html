<!DOCTYPE html>
<html th:replace="~{layout :: layout}" lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Групповые приказы о зачислении</title>
</head>
<body>
<div th:fragment="content">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Групповые приказы о зачислении</h2>
        <a href="/enrollments-more/new" class="btn btn-success">
            <i class="bi bi-plus-lg"></i> Новый приказ
        </a>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <form th:action="@{/enrollments-more}" th:object="${filter}" method="get" class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Номер приказа</label>
                    <input type="text" class="form-control" th:field="*{documentNumber}" placeholder="Поиск по номеру">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Класс</label>
                    <input type="text" class="form-control" th:field="*{className}" placeholder="Название класса">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Создатель</label>
                    <input type="text" class="form-control" th:field="*{creatorName}" placeholder="ФИО создателя">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Дата приказа от</label>
                    <input type="date" class="form-control" th:field="*{dateFrom}">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Дата приказа до</label>
                    <input type="date" class="form-control" th:field="*{dateTo}">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Дата зачисления от</label>
                    <input type="date" class="form-control" th:field="*{effectiveDateFrom}">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Дата зачисления до</label>
                    <input type="date" class="form-control" th:field="*{effectiveDateTo}">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-search"></i> Применить
                        </button>
                        <a href="/enrollments-more" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Сбросить
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div th:if="${enrollments.empty}" class="alert alert-info">
        <i class="bi bi-info-circle"></i> Нет приказов, соответствующих критериям поиска.
        <a href="/enrollments-more/new" class="alert-link">Создать первый приказ</a>
    </div>

    <div class="card shadow" th:unless="${enrollments.empty}">
        <div class="card-header bg-light">
            <i class="bi bi-list-check"></i> Список приказов
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Номер</th>
                    <th>Дата приказа</th>
                    <th>Учеников</th>
                    <th>Класс</th>
                    <th>Дата зачисления</th>
                    <th>Создатель</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${enrollments}">
                    <td th:text="${e.id}">1</td>
                    <td th:text="${e.documentNumber}">Пр-Зач-Груп-1-25</td>
                    <td th:text="${#temporals.format(e.documentDate, 'dd.MM.yyyy')}">...</td>
                    <td th:text="${#lists.size(e.items)}">3</td>
                    <td th:text="${e.className}">10А</td>
                    <td th:text="${#temporals.format(e.dateFrom, 'dd.MM.yyyy')}">01.09.2024</td>
                    <td th:text="${e.creatorFullName}">Петрова Мария</td>
                    <td>
                        <a th:href="@{/enrollments-more/{id}(id=${e.id})}" class="btn btn-sm btn-info">
                            <i class="bi bi-eye"></i> Карточка
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
