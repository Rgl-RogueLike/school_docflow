<!DOCTYPE html>
<html th:replace="~{layout :: layout}" lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить ученика</title>
</head>
<body>

<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Добавление нового ученика</h4>
                </div>
                <div class="card-body">
                    <form action="#" th:action="@{/students/new}" th:object="${studentDto}" method="post">

                        <div class="mb-3">
                            <label for="lastName" class="form-label">Фамилия</label>
                            <input type="text" class="form-control" id="lastName" th:field="*{lastName}" required placeholder="Иванов">
                        </div>

                        <div class="mb-3">
                            <label for="firstName" class="form-label">Имя</label>
                            <input type="text" class="form-control" id="firstName" th:field="*{firstName}" required placeholder="Иван">
                        </div>

                        <div class="mb-3">
                            <label for="patronymic" class="form-label">Отчество</label>
                            <input type="text" class="form-control" id="patronymic" th:field="*{patronymic}" placeholder="Иванович">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="gender" class="form-label">Пол</label>
                                <select class="form-select" id="gender" th:field="*{gender}" required>
                                    <option value="">Выберите...</option>
                                    <option th:each="g : ${T(com.haritonov.school.docflow.modules.student.model.enums.Gender).values()}"
                                            th:value="${g}"
                                            th:text="${g.displayName}"></option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="dateOfBirth" class="form-label">Дата рождения</label>
                                <input type="date" class="form-control" id="dateOfBirth" th:field="*{dateOfBirth}" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="classId" class="form-label">Класс</label>
                            <select class="form-select" id="classId" th:field="*{classId}" required>
                                <option value="">Выберите класс...</option>
                                <option th:each="c : ${classes}"
                                        th:value="${c.id}"
                                        th:text="${c.name}">
                                    10А
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="dateOfEnrollment" class="form-label">Дата зачисления</label>
                            <input type="date" class="form-control" id="dateOfEnrollment" th:field="*{dateOfEnrollment}" required>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="/students" class="btn btn-secondary">Отмена</a>
                            <button type="submit" class="btn btn-success">Сохранить</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
