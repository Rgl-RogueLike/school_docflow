<!DOCTYPE html>
<html th:replace="~{layout :: layout}" lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Редактирование ученика</title>
</head>
<body>

<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="${title}">Редактирование ученика</h2>
        <a th:href="@{/students/{id}(id=${student.id})}" class="btn btn-outline-secondary">
            ← Вернуться к карточке
        </a>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <form th:action="@{/students/{id}/edit(id=${student.id})}" th:object="${student}" method="post">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="lastName" class="form-label">Фамилия *</label>
                        <input type="text" class="form-control" id="lastName" th:field="*{lastName}" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="firstName" class="form-label">Имя *</label>
                        <input type="text" class="form-control" id="firstName" th:field="*{firstName}" required>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label for="patronymic" class="form-label">Отчество</label>
                        <input type="text" class="form-control" id="patronymic" th:field="*{patronymic}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="gender" class="form-label">Пол *</label>
                        <select class="form-select" id="gender" th:field="*{gender}" required>
                            <option value="">Выберите пол</option>
                            <option value="MALE">Мужской</option>
                            <option value="FEMALE">Женский</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="dateOfBirth" class="form-label">Дата рождения *</label>
                        <input type="date" class="form-control" id="dateOfBirth" th:field="*{dateOfBirth}" required>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label for="classId" class="form-label">Класс *</label>
                        <select class="form-select" id="classId" th:field="*{classId}" required>
                            <option value="">Выберите класс</option>
                            <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.name} + ' (' + ${c.year} + ')'"></option>
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-3">
                    <a th:href="@{/students/{id}(id=${student.id})}" class="btn btn-secondary">Отмена</a>
                    <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
