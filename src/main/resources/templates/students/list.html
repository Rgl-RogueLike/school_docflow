<!DOCTYPE html>
<html th:replace="~{layout :: layout}" lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Обучающиеся</title>
</head>
<body>

<div th:fragment="content">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="${title}">Заголовок</h2>
        <a href="/students" class="btn btn-outline-primary" th:if="${selectedClassId != null}">
            Вернуться к выбору класса
        </a>
    </div>

    <div th:if="${selectedClassId == null}">
        <div class="row">
            <div class="col-md-12 mb-3">
                <div class="card bg-light">
                    <div class="card-body">
                        <p class="text-muted mb-0">
                            <i class="bi bi-info-circle"></i>
                            Для просмотра списка учеников выберите класс.
                        </p>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-3 mb-3" th:each="c : ${classes}">
                <div class="card text-center h-100 shadow-sm border-primary">
                    <div class="card-body d-flex flex-column justify-content-center">
                        <a th:href="@{/students(classId=${c.id})}" class="text-decoration-none text-dark">
                            <h3 class="card-title fw-bold" th:text="${c.name}">10А</h3>
                        </a>
                        <small class="text-muted" th:text="'Год набора: ' + ${c.year}"></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${selectedClassId != null}">

        <div class="card mb-3">
            <div class="card-body">
                <form th:action="@{/students(classId=${selectedClassId})}" th:object="${filter}" method="get" class="row g-3">
                    <input type="hidden" name="classId" th:value="${selectedClassId}">
                    <div class="col-md-3">
                        <label class="form-label">Фамилия</label>
                        <input type="text" class="form-control" th:field="*{lastName}" placeholder="Фамилия">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Имя</label>
                        <input type="text" class="form-control" th:field="*{firstName}" placeholder="Имя">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Отчество</label>
                        <input type="text" class="form-control" th:field="*{patronymic}" placeholder="Отчество">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Пол</label>
                        <select class="form-select" th:field="*{gender}">
                            <option value="">Все</option>
                            <option value="MALE">Мужской</option>
                            <option value="FEMALE">Женский</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Дата рождения от</label>
                        <input type="date" class="form-control" th:field="*{dateOfBirthFrom}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Дата рождения до</label>
                        <input type="date" class="form-control" th:field="*{dateOfBirthTo}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Дата зачисления от</label>
                        <input type="date" class="form-control" th:field="*{dateOfEnrollmentFrom}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Дата зачисления до</label>
                        <input type="date" class="form-control" th:field="*{dateOfEnrollmentTo}">
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-search"></i> Применить
                            </button>
                            <a th:href="@{/students(classId=${selectedClassId})}" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Сбросить
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-header bg-light d-flex justify-content-between align-items-center">
                <span th:text="'Класс: ' + (${selectedClass != null ? selectedClass.name : ''})">
                    Класс: ...
                </span>
                <span class="badge bg-secondary">
                    Всего учеников: <span th:text="${#lists.size(students)}"></span>
                </span>
            </div>
            <div class="card-body">
                <div th:if="${students != null and students.isEmpty()}" class="alert alert-warning">
                    <i class="bi bi-exclamation-triangle"></i>
                    В этом классе нет учеников, соответствующих критериям поиска.
                </div>
                <div th:unless="${students == null or students.isEmpty()}">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>ФИО</th>
                            <th>Пол</th>
                            <th>Дата рождения</th>
                            <th>Дата зачисления</th>
                            <th>Действия</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="student : ${students}">
                            <td th:text="${student.id}">1</td>
                            <td th:text="${student.fullName}">Иванов Иван</td>
                            <td>
                                <span th:if="${student.gender == 'MALE'}">Мужской</span>
                                <span th:if="${student.gender == 'FEMALE'}">Женский</span>
                            </td>
                            <td th:text="${#temporals.format(student.dateOfBirth, 'dd.MM.yyyy')}">01.01.2010</td>
                            <td th:text="${#temporals.format(student.dateOfEnrollment, 'dd.MM.yyyy')}">01.09.2024</td>
                            <td>
                                <a th:href="@{/students/{id}(id=${student.id})}" class="btn btn-sm btn-primary">Карточка</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
