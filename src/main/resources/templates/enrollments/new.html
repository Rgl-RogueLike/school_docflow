<!DOCTYPE html>
<html th:replace="~{layout :: layout}" lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Новый приказ о зачислении</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-success text-white">Создание приказа о зачислении</div>
                <div class="card-body">
                    <form th:action="@{/enrollments/new}" th:object="${enrollmentDto}" method="post">
                        <h5 class="mb-3">Данные приказа</h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label>Номер приказа</label>
                                <input type="text" class="form-control" th:field="*{documentNumber}" placeholder="Пр-Зач-1-24" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Дата приказа</label>
                                <input type="date" class="form-control" th:field="*{documentDate}" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label>Дата зачисления</label>
                                <input type="date" class="form-control" th:field="*{enrollmentDate}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Класс зачисления</label>
                                <select class="form-select" th:field="*{classId}" required>
                                    <option value="">-- выберите --</option>
                                    <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.name} + ' (' + ${c.year} + ')'"></option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label>Основание</label>
                            <textarea class="form-control" th:field="*{reason}" rows="2" placeholder="Например: на основании заявления родителей"></textarea>
                        </div>

                        <hr class="my-4">
                        <h5 class="mb-3">Данные ученика</h5>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label>Фамилия *</label>
                                <input type="text" class="form-control" th:field="*{lastName}" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label>Имя *</label>
                                <input type="text" class="form-control" th:field="*{firstName}" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label>Отчество</label>
                                <input type="text" class="form-control" th:field="*{patronymic}">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label>Пол *</label>
                                <select class="form-select" th:field="*{gender}" required>
                                    <option value="">-- выберите --</option>
                                    <option th:value="MALE">Мужской</option>
                                    <option th:value="FEMALE">Женский</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Дата рождения *</label>
                                <input type="date" class="form-control" th:field="*{dateOfBirth}" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="/enrollments" class="btn btn-secondary">Отмена</a>
                            <button type="submit" class="btn btn-success">Создать приказ и ученика</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
