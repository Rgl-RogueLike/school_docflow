<!DOCTYPE html>
<html th:replace="~{layout :: layout}" lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Приказы о зачислении</title>
</head>
<body>
<div th:fragment="content">
    <div th:if="${success}" class="alert alert-success">[[${success}]]</div>
    <div th:if="${error}" class="alert alert-danger">[[${error}]]</div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Приказы о зачислении</h2>
        <a href="/enrollments/new" class="btn btn-success">+ Новый приказ</a>
    </div>

    <div th:if="${enrollments.empty}" class="alert alert-info">
        Нет ни одного приказа. <a href="/enrollments/new">Создать первый</a>
    </div>

    <div class="card shadow" th:unless="${enrollments.empty}">
        <div class="card-header bg-light">Список приказов</div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>№</th>
                    <th>Номер</th>
                    <th>Дата</th>
                    <th>Ученик</th>
                    <th>Класс</th>
                    <th>Дата зачисления</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${enrollments}">
                    <td th:text="${e.id}">1</td>
                    <td th:text="${e.documentNumber}">Пр-Зач-1-24</td>
                    <td th:text="${#temporals.format(e.documentDate, 'dd.MM.yyyy')}">...</td>
                    <td th:text="${e.studentFullName}">Иванов Иван</td>
                    <td th:text="${e.className}">10А</td>
                    <td th:text="${#temporals.format(e.enrollmentDate, 'dd.MM.yyyy')}">01.09.2024</td>
                    <td>
                        <a th:href="@{/enrollments/{id}(id=${e.id})}" class="btn btn-sm btn-info">Карточка</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
