<!DOCTYPE html>
<html th:replace="~{layout :: layout}" lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Новая справка</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-success text-white">Создание справки об освобождении</div>
                <div class="card-body">
                    <form th:action="@{/certificates/new}" th:object="${certificateDto}" method="post">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Номер справки</label>
                            <input type="text" class="form-control" th:field="*{documentNumber}" readonly>
                            <small class="text-muted">Номер генерируется автоматически</small>
                        </div>
                        <div class="mb-3">
                            <label>Дата документа</label>
                            <input type="date" class="form-control" th:field="*{documentDate}" required>
                        </div>
                        <div class="mb-3">
                            <label>Ученик</label>
                            <select class="form-select" th:field="*{studentId}" required>
                                <option value="">-- выберите --</option>
                                <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.fullName}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>Цель освобождения</label>
                            <textarea class="form-control" th:field="*{purpose}" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label>Дата начала</label>
                            <input type="date" class="form-control" th:field="*{dateFrom}" required>
                        </div>
                        <div class="mb-3">
                            <label>Дата окончания</label>
                            <input type="date" class="form-control" th:field="*{issueDate}" required>
                        </div>
                        <div class="mb-3">
                            <label>Сотрудник (создатель)</label>
                            <select class="form-select" th:field="*{creatorId}" required>
                                <option value="">-- выберите --</option>
                                <option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.fullName}"></option>
                            </select>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="/certificates" class="btn btn-secondary">Отмена</a>
                            <button type="submit" class="btn btn-success">Сохранить</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
