<!DOCTYPE html>
<html th:replace="~{layout :: layout}" lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Справки об обучении</title>
</head>
<body>
<div th:fragment="content">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Справки об обучении</h2>
        <a href="/certificates/new" class="btn btn-success">
            <i class="bi bi-plus-lg"></i> Новая справка
        </a>
    </div>

    <!-- Форма фильтрации -->
    <div class="card mb-3">
        <div class="card-body">
            <form th:action="@{/certificates}" th:object="${filter}" method="get" class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Номер справки</label>
                    <input type="text" class="form-control" th:field="*{documentNumber}" placeholder="Поиск по номеру">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Ученик</label>
                    <input type="text" class="form-control" th:field="*{studentName}" placeholder="ФИО ученика">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Класс</label>
                    <input type="text" class="form-control" th:field="*{className}" placeholder="Название класса">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Создатель</label>
                    <input type="text" class="form-control" th:field="*{creatorName}" placeholder="ФИО создателя">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Дата от</label>
                    <input type="date" class="form-control" th:field="*{dateFrom}">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Дата до</label>
                    <input type="date" class="form-control" th:field="*{dateTo}">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-search"></i> Применить
                        </button>
                        <a href="/certificates" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Сбросить
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div th:if="${certificates.empty}" class="alert alert-info">
        <i class="bi bi-info-circle"></i> Нет справок, соответствующих критериям поиска.
        <a href="/certificates/new" class="alert-link">Создать первую справку</a>
    </div>

    <div class="card shadow" th:unless="${certificates.empty}">
        <div class="card-header bg-light">
            <i class="bi bi-list-check"></i> Список справок об обучении
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Номер</th>
                    <th>Дата</th>
                    <th>Ученик</th>
                    <th>Класс</th>
                    <th>Учебный год</th>
                    <th>Создатель</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${certificates}">
                    <td th:text="${c.id}">1</td>
                    <td th:text="${c.documentNumber}">Спр-Обуч-1-2026</td>
                    <td th:text="${#temporals.format(c.documentDate, 'dd.MM.yyyy')}">...</td>
                    <td th:text="${c.studentFullName}">Иванов Иван</td>
                    <td th:text="${c.studentClassName}">10А</td>
                    <td th:text="${c.academicYear}">2025-2026</td>
                    <td th:text="${c.creatorFullName}">Петрова Мария</td>
                    <td>
                        <a th:href="@{/certificates/{id}(id=${c.id})}" class="btn btn-sm btn-info">
                            <i class="bi bi-eye"></i> Карточка
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
