<!DOCTYPE html>
<html th:replace="~{layout :: layout}" lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить должность</title>
</head>
<body>

<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Добавление должности</h4>
                </div>
                <div class="card-body">
                    <form action="#" th:action="@{/positions/new}" th:object="${positionDto}" method="post">

                        <div class="mb-3">
                            <label for="name" class="form-label">Название должности *</label>
                            <input type="text" class="form-control" id="name"
                                   th:field="*{name}" required
                                   placeholder="Учитель">
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="/positions" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Отмена
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-save"></i> Сохранить
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
