<!DOCTYPE html>
<html th:replace="~{layout :: layout}" lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Приказы о временном перемещении</title>
</head>
<body>
<div th:fragment="content">
  <div th:if="${success}" class="alert alert-success">[[${success}]]</div>
  <div th:if="${error}" class="alert alert-danger">[[${error}]]</div>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Приказы о временном перемещении</h2>
    <a href="/dislocations/new" class="btn btn-success">+ Новый приказ</a>
  </div>

  <div th:if="${dislocations.empty}">
    <div class="alert alert-info">Нет ни одного приказа. <a href="/dislocations/new">Создать первый</a></div>
  </div>

  <div class="card shadow" th:unless="${dislocations.empty}">
    <div class="card-header bg-light">Список приказов</div>
    <div class="card-body">
      <table class="table table-hover">
        <thead>
        <tr>
          <th>№</th>
          <th>Номер</th>
          <th>Дата</th>
          <th>Ученик</th>
          <th>Период перемещения</th>
          <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${dislocations}">
          <td th:text="${d.id}">1</td>
          <td th:text="${d.documentNumber}">Пр-Пер-1-24</td>
          <td th:text="${#temporals.format(d.documentDate, 'dd.MM.yyyy')}">...</td>
          <td th:text="${d.studentFullName}">Иванов Иван</td>
          <td th:text="${#temporals.format(d.effectiveStartDate, 'dd.MM.yyyy')} + ' - ' + ${#temporals.format(d.effectiveEndDate, 'dd.MM.yyyy')}"></td>
          <td>
            <a th:href="@{/dislocations/{id}(id=${d.id})}" class="btn btn-sm btn-primary">Карточка</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
