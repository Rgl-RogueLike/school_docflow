<!DOCTYPE html>
<html th:replace="~{layout :: layout}" lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Новый приказ о перемещении</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-success text-white">Создание приказа о временном перемещении</div>
                <div class="card-body">
                    <form th:action="@{/dislocations/new}" th:object="${dislocationDto}" method="post">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Номер приказа</label>
                            <input type="text" class="form-control" th:field="*{documentNumber}" readonly>
                            <small class="text-muted">Номер генерируется автоматически</small>
                        </div>
                        <div class="mb-3">
                            <label>Дата приказа</label>
                            <input type="date" class="form-control" th:field="*{documentDate}" required>
                        </div>
                        <div class="mb-3">
                            <label>Ученик</label>
                            <select class="form-select" th:field="*{studentId}" required>
                                <option value="">-- выберите --</option>
                                <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.fullName}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>В отношении</label>
                            <input type="text" class="form-control" th:field="*{relation}" placeholder="например, перевода в другой класс">
                        </div>
                        <div class="mb-3">
                            <label>Основание</label>
                            <textarea class="form-control" th:field="*{basis}" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label>Дата начала действия</label>
                            <input type="date" class="form-control" th:field="*{dateFrom}" required>
                        </div>
                        <div class="mb-3">
                            <label>Дата начала перемещения</label>
                            <input type="date" class="form-control" th:field="*{effectiveStartDate}" required>
                        </div>
                        <div class="mb-3">
                            <label>Дата окончания перемещения</label>
                            <input type="date" class="form-control" th:field="*{effectiveEndDate}" required>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="/dislocations" class="btn btn-secondary">Отмена</a>
                            <button type="submit" class="btn btn-success">Сохранить</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
