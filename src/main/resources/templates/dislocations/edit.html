<!DOCTYPE html>
<html th:replace="~{layout :: layout}" lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Редактирование приказа о временном выбытии</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <i class="bi bi-pencil-square"></i> Редактирование приказа о временном выбытии
                </div>
                <div class="card-body">
                    <form th:action="@{/dislocations/{id}/edit(id=${dislocationDto.id})}" th:object="${dislocationDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Номер приказа</label>
                            <input type="text" class="form-control" th:field="*{documentNumber}" readonly>
                            <small class="text-muted">Номер изменять нельзя</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Дата приказа</label>
                            <input type="date" class="form-control" th:field="*{documentDate}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ученик</label>
                            <select class="form-select" th:field="*{studentId}" required>
                                <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.fullName}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Основание</label>
                            <textarea class="form-control" th:field="*{basis}" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Дата начала выбытия</label>
                            <input type="date" class="form-control" th:field="*{effectiveStartDate}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Дата окончания выбытия</label>
                            <input type="date" class="form-control" th:field="*{effectiveEndDate}" required>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/dislocations/{id}(id=${dislocationDto.id})}" class="btn btn-secondary">Отмена</a>
                            <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
