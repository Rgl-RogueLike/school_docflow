<!DOCTYPE html>
<html th:fragment="layout" lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Школьный Документооборот</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body { background-color: #f8f9fa; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Документооборот</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" href="/">Главная</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownDocs" role="button" data-bs-toggle="dropdown">
                        Документы
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/orders">Приказы</a></li>
                        <li><a class="dropdown-item" href="/certificates">Справки</a></li>
                    </ul>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownRef" role="button" data-bs-toggle="dropdown">
                        Справочники
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/students">Ученики</a></li>
                        <li><a class="dropdown-item" href="/classes">Учебные классы</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="/employees">Сотрудники</a></li>
                        <li><a class="dropdown-item" href="/positions">Должности</a></li>
                    </ul>
                </li>
            </ul>
        </div>

        <div class="d-flex align-items-center ms-auto">
            <span class="text-white me-2" th:text="${username != null ? 'Авторизованный пользователь: ' + username : 'Гость'}">
                Гость
            </span>
            <a href="/logout" class="btn btn-outline-light btn-sm">Выйти</a>
        </div>

    </div>
</nav>

<div class="container-fluid mt-4">
    <div th:replace="~{::content}"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
