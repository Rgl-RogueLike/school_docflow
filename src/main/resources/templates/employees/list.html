<!DOCTYPE html>
<html th:replace="~{layout :: layout}" lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Сотрудники</title>
</head>
<body>

<div th:fragment="content">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Сотрудники</h2>
        <a href="/employees/new" class="btn btn-success">
            <i class="bi bi-plus-lg"></i> Добавить сотрудника
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>ФИО</th>
                    <th>Телефон</th>
                    <th>Должность</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${employees}">
                    <td th:text="${e.id}">1</td>
                    <td th:text="${e.fullName}">Иванов Иван Иванович</td>
                    <td th:text="${e.phoneNumber}">+7(123)456-78-90</td>
                    <td th:text="${e.positionName}">Учитель</td>
                    <td>
                        <a th:href="@{/employees/{id}(id=${e.id})}" class="btn btn-sm btn-info">
                            Карточка
                        </a>
                    </td>
                </tr>
                <tr th:if="${employees.isEmpty()}">
                    <td colspan="5" class="text-center text-muted">Список пуст. Добавьте первого сотрудника.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
