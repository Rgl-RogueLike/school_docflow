<!DOCTYPE html>
<html th:replace="~{layout :: layout}" lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Редактирование сотрудника</title>
</head>
<body>

<div th:fragment="content">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Редактирование сотрудника</h4>
        </div>
        <div class="card-body">
          <form th:action="@{/employees/{id}/edit(id=${employeeDto.id})}" th:object="${employeeDto}" method="post">
            <div class="mb-3">
              <label class="form-label">Фамилия *</label>
              <input type="text" class="form-control" th:field="*{lastName}" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Имя *</label>
              <input type="text" class="form-control" th:field="*{firstName}" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Отчество</label>
              <input type="text" class="form-control" th:field="*{patronymic}">
            </div>
            <div class="mb-3">
              <label class="form-label">Телефон</label>
              <input type="tel" class="form-control" th:field="*{phoneNumber}">
            </div>
            <div class="mb-3">
              <label class="form-label">Дата приёма на работу *</label>
              <input type="date" class="form-control" th:field="*{dateOfEmployment}" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Должность *</label>
              <select class="form-select" th:field="*{positionId}" required>
                <option value="">Выберите должность</option>
                <option th:each="p : ${positions}" th:value="${p.id}" th:text="${p.name}"></option>
              </select>
            </div>
            <div class="d-flex justify-content-between">
              <a th:href="@{/employees/{id}(id=${employeeDto.id})}" class="btn btn-secondary">Отмена</a>
              <button type="submit" class="btn btn-primary">Сохранить изменения</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
